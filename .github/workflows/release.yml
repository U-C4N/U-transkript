name: Release

# Publishing a GitHub release runs every CI check on the release commit, makes sure that commit
# is on main, builds the package and uploads it to PyPI through Trusted Publishing (no token).
# The upload waits in the "pypi" environment until a maintainer approves it. Running the
# workflow by hand only checks and builds the package.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - name: The release tag names the package version
        if: github.event_name == 'release'
        run: |
          version=$(uv run --no-project python -c "import runpy; print(runpy.run_path('src/utmax/_version.py')['__version__'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not name the package version $version (expected v$version)."
            exit 1
          fi
      - name: The release commit is on main
        if: github.event_name == 'release'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The release commit $GITHUB_SHA is not on main; release from a merged commit."
            exit 1
          fi
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: The wheel contains only the utmax package
        run: >-
          uv run --no-project python -c "import glob, zipfile;
          names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist();
          bad = [n for n in names if not n.startswith(('utmax/', 'u_transcript_max-'))];
          assert not bad, bad"
      - name: The wheel installs and imports
        run: uv run --no-project --isolated --with dist/*.whl python -c "import utmax, utmax.compat, utmax.mcp; print(utmax.__version__)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    if: github.event_name == 'release'
    needs: [ci, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/u-transcript-max/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Pinned by commit: PyPA publishes the container image of every commit
      # (ghcr.io/pypa/gh-action-pypi-publish:<sha>; checked on 2026-11-09).
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
